name: Kịch bản chạy nhiều tàu - Điều kiện trơn/ướt
description: |
  Scenario mô phỏng:
  - 5 tàu chạy liên tiếp với headway 60 giây (gần nhau hơn)
  - Các khu vực trơn (wet/slippery) được biểu diễn bằng TSR zones
  - Dốc cao ở khu vực 800-1000m (nơi dễ trơn nhất)
  - Các điều kiện vận hành phức tạp cho ATP/ATO

display:
  window_title: CBTC ATC - Multi-Train Slippery Conditions Test
  track_min_m: -220.0
  track_max_m: 2000.0
  track_labels:
  - 0
  - 500
  - 1000
  - 1500
  - 2000

train_defaults:
  length_m: 60.0
  mass_kg: 291600.0          # Normal passenger load (AW2)
  drive_mode: ATO             # Automatic train operation
  max_ato_speed_kmh: 65.0     # Slightly reduced for safety

radio_access_points:
- id: RAP_01
  start_m: -300.0
  end_m: 900.0
- id: RAP_02
  start_m: 800.0
  end_m: 1700.0
- id: RAP_03
  start_m: 1600.0
  end_m: 2500.0

localization:
  balises:
  - id: BL_-200
    pos_m: -200.0
  - id: BL_0000
    pos_m: 0.0
  - id: BL_0200
    pos_m: 200.0
  - id: BL_0400
    pos_m: 400.0
  - id: BL_0600
    pos_m: 600.0
  - id: BL_0800
    pos_m: 800.0
  - id: BL_1000
    pos_m: 1000.0
  - id: BL_1200
    pos_m: 1200.0
  - id: BL_1400
    pos_m: 1400.0
  - id: BL_1600
    pos_m: 1600.0
  - id: BL_1800
    pos_m: 1800.0
  - id: BL_2000
    pos_m: 2000.0

track:
  segments:
  # Khu vực xuất phát: chuẩn
  - start_m: 0.0
    end_m: 500.0
    gradient: 0.02
    psr_kmh: 60.0
  
  # Khu vực dốc cao 1: dễ trơn (gradient 5%)
  - start_m: 500.0
    end_m: 1000.0
    gradient: 0.05
    psr_kmh: 40.0
  
  # Khu vực dốc xuống: rất dễ trơn (gradient -6%)
  - start_m: 1000.0
    end_m: 1500.0
    gradient: -0.06
    psr_kmh: 50.0
  
  # Khu vực cuối: gradient nhẹ
  - start_m: 1500.0
    end_m: 2000.0
    gradient: -0.01
    psr_kmh: 60.0

scheduled_stops:
- name: STATION_1000
  pos_m: 1000.0
  length_m: 160.0
  capacity: 3
  dwell_time_s: 20.0
- name: STATION_1500
  pos_m: 1500.0
  length_m: 160.0
  capacity: 4
  dwell_time_s: 25.0
- name: STATION_2000
  pos_m: 2000.0
  length_m: 160.0
  capacity: 4
  dwell_time_s: 30.0

trains: []  # Tàu được tạo từ source_trains

source_trains:
- name: DEPOT
  start_m: -200.0
  length_m: 200.0
  capacity: 5
  total_trains: 5  # 5 tàu chạy liên tiếp

# Headway ngắn hơn - các tàu gần nhau hơn
headway:
  mode: fixed
  target_headway_s: 60.0  # 60 giây thay vì 80 giây

# TSR Zones: Các khu vực trơn/ướt
# Được đặt ở nơi gradient cao để mô phỏng điều kiện trơn thực tế
tsr_zones:
  # Khu vực dốc 1: 500-700m (gradient 5%)
  # Trơn do gradient cao, giới hạn 35 km/h
  - start: 500.0
    end: 700.0
    speed: 35.0
  
  # Khu vực dốc cao nhất: 750-900m (gradient 5%)
  # Rất trơn, giới hạn 30 km/h
  - start: 750.0
    end: 900.0
    speed: 30.0
  
  # Khu vực dốc xuống: 1000-1200m (gradient -6%)
  # Trơn khi phanh, giới hạn 45 km/h
  - start: 1000.0
    end: 1200.0
    speed: 45.0
  
  # Khu vực sau ga: 1300-1400m (recovery zone)
  # Điều kiện cải thiện, nhưng vẫn cần thận trọng
  - start: 1300.0
    end: 1400.0
    speed: 50.0

# Line conditions: Các điều kiện đường bộ
line_conditions:
  # Khu vực 500-1000m: Ẩm
  - range:
      start_m: 500.0
      end_m: 1000.0
    weather: WET
    friction_coefficient: 0.35  # Thấp hơn bình thường (0.7-0.9)
    visibility: REDUCED
    description: "Mưa vừa, mặt đường ẩm"
  
  # Khu vực 1000-1200m: Rất ẩm
  - range:
      start_m: 1000.0
      end_m: 1200.0
    weather: WET
    friction_coefficient: 0.30  # Rất thấp
    visibility: POOR
    description: "Mưa nặng, mặt đường rất trơn"
  
  # Khu vực còn lại: Bình thường
  - range:
      start_m: 0.0
      end_m: 500.0
    weather: NORMAL
    friction_coefficient: 0.80
    visibility: GOOD
    description: "Điều kiện chuẩn"
  
  - range:
      start_m: 1200.0
      end_m: 2000.0
    weather: NORMAL
    friction_coefficient: 0.75
    visibility: GOOD
    description: "Điều kiện tốt, bám dính phục hồi"

# Các hành động chạy scenario (có thể được thêm)
events: []
  # Ví dụ: có thể thêm sự kiện như "enable_fault" tại thời điểm cụ thể
  # - time_s: 100.0
  #   action: enable_fault
  #   fault_name: packet_loss
