name: Kịch bản chạy nhiều tàu - Điều kiện cực đoan (Wet + Network Faults)
description: |
  Scenario mô phỏng các tình huống cực đoan:
  - 4 tàu chạy gần nhau (headway 50 giây)
  - Các khu vực rất trơn (friction rất thấp)
  - Mất bám dính ở các khu vực nguy hiểm nhất
  - Có thể thêm network faults để kiểm tra sự phục hồi của ATP/ATO
  
  Mục tiêu:
  - Kiểm tra khả năng an toàn của hệ thống
  - Xác minh ATP có thể đạt yêu cầu tối thiểu
  - Kiểm tra ATO performance khi điều kiện xấu

display:
  window_title: CBTC ATC - Extreme Conditions Multi-Train Test
  track_min_m: -220.0
  track_max_m: 2000.0
  track_labels:
  - 0
  - 500
  - 1000
  - 1500
  - 2000

train_defaults:
  length_m: 60.0
  mass_kg: 331960.0           # Crush load (AW3) - tàu nặng hơn
  drive_mode: ATO
  max_ato_speed_kmh: 60.0     # Giới hạn rất thấp cho điều kiện tối ưu

radio_access_points:
- id: RAP_01
  start_m: -300.0
  end_m: 900.0
- id: RAP_02
  start_m: 800.0
  end_m: 1700.0
- id: RAP_03
  start_m: 1600.0
  end_m: 2500.0

localization:
  balises:
  - id: BL_-200
    pos_m: -200.0
  - id: BL_0000
    pos_m: 0.0
  - id: BL_0200
    pos_m: 200.0
  - id: BL_0400
    pos_m: 400.0
  - id: BL_0600
    pos_m: 600.0
  - id: BL_0800
    pos_m: 800.0
  - id: BL_1000
    pos_m: 1000.0
  - id: BL_1200
    pos_m: 1200.0
  - id: BL_1400
    pos_m: 1400.0
  - id: BL_1600
    pos_m: 1600.0
  - id: BL_1800
    pos_m: 1800.0
  - id: BL_2000
    pos_m: 2000.0

track:
  segments:
  # Khu vực xuất phát: chuẩn, cho các tàu tăng tốc
  - start_m: 0.0
    end_m: 400.0
    gradient: 0.02
    psr_kmh: 60.0
  
  # Khu vực dốc cao 1: TẠI ĐÂY LÀ NGUY HIỂM NHẤT (gradient 5%)
  - start_m: 400.0
    end_m: 900.0
    gradient: 0.05
    psr_kmh: 35.0
  
  # Khu vực dốc xuống cực thoát: rất mạo hiểm (gradient -7%)
  - start_m: 900.0
    end_m: 1400.0
    gradient: -0.07
    psr_kmh: 40.0
  
  # Khu vực phục hồi: gradient chuyển tiếp
  - start_m: 1400.0
    end_m: 1800.0
    gradient: -0.02
    psr_kmh: 50.0
  
  # Khu vực cuối: điều kiện chuẩn
  - start_m: 1800.0
    end_m: 2000.0
    gradient: 0.01
    psr_kmh: 60.0

scheduled_stops:
- name: STATION_0800
  pos_m: 800.0
  length_m: 160.0
  capacity: 3
  dwell_time_s: 15.0
- name: STATION_1200
  pos_m: 1200.0
  length_m: 160.0
  capacity: 4
  dwell_time_s: 20.0
- name: STATION_1800
  pos_m: 1800.0
  length_m: 160.0
  capacity: 4
  dwell_time_s: 25.0

trains: []

source_trains:
- name: DEPOT
  start_m: -200.0
  length_m: 200.0
  capacity: 4
  total_trains: 4  # 4 tàu nặng chạy gần nhau

headway:
  mode: fixed
  target_headway_s: 50.0  # Rất ngắn - 50 giây

# TSR Zones: Rất giới hạn tốc độ ở khu vực nguy hiểm
tsr_zones:
  # Khu vực dốc cao - nguy hiểm nhất
  - start: 400.0
    end: 600.0
    speed: 30.0
  
  # Khu vực dốc cao - phần cuối
  - start: 600.0
    end: 900.0
    speed: 25.0
  
  # Khu vực dốc xuống - rất nguy hiểm
  - start: 900.0
    end: 1100.0
    speed: 35.0
  
  # Khu vực dốc xuống - phần cuối
  - start: 1100.0
    end: 1400.0
    speed: 40.0
  
  # Khu vực phục hồi
  - start: 1400.0
    end: 1600.0
    speed: 45.0

# Line Conditions: RẤT XẤU
line_conditions:
  # Khu vực CHUẨN (khô)
  - range:
      start_m: 0.0
      end_m: 400.0
    weather: NORMAL
    friction_coefficient: 0.80
    visibility: GOOD
    description: "Chuẩn - khô"
  
  # Khu vực 1: MƯA VỪA
  - range:
      start_m: 400.0
      end_m: 700.0
    weather: WET
    friction_coefficient: 0.40
    visibility: REDUCED
    description: "Mưa vừa - mặt đường ẩm"
  
  # Khu vực 2: MƯA NẶNG + TRƠN CỰC ĐỘ
  - range:
      start_m: 700.0
      end_m: 1000.0
    weather: HEAVY_RAIN
    friction_coefficient: 0.25
    visibility: POOR
    description: "Mưa nặng + bão - rất trơn, phanh giảm hiệu lực"
  
  # Khu vực 3: MƯA NẶNG TIẾP TỤC
  - range:
      start_m: 1000.0
      end_m: 1300.0
    weather: HEAVY_RAIN
    friction_coefficient: 0.28
    visibility: POOR
    description: "Mưa nặng - phanh có nguy cơ mất hiệu lực"
  
  # Khu vực 4: MƯA GIẢM
  - range:
      start_m: 1300.0
      end_m: 1700.0
    weather: WET
    friction_coefficient: 0.45
    visibility: REDUCED
    description: "Mưa giảm - bám dính phục hồi dần"
  
  # Khu vực 5: CHUẨN
  - range:
      start_m: 1700.0
      end_m: 2000.0
    weather: NORMAL
    friction_coefficient: 0.80
    visibility: GOOD
    description: "Mưa dừng - điều kiện bình thường"

# Các sự kiện có thể xảy ra
events:
  # Có thể thêm fault injection để kiểm tra khả năng phục hồi
  # Ví dụ: kích hoạt packet loss ở thời điểm tàu đi qua khu vực nguy hiểm nhất
  # - time_s: 180.0
  #   action: enable_fault
  #   fault_name: packet_loss
  #   duration_s: 30.0
  # - time_s: 180.0
  #   action: degrade_path
  #   path_name: RED
  #   new_state: DEGRADED
